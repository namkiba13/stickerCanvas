server_names_hash_bucket_size 128;

server {
    listen 80;
    server_name www.94chat.app uqjvr9mvf4zqrmcofpqxpsbh.66.163.122.150.sslip.io;
    return 301 https://94chat.app$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /(assets|models)/ { expires 7d; try_files $uri =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
